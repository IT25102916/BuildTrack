spring.application.name=ConstructIQ

# ── Microsoft SQL Server ──────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=constructiqdb;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=password

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
# Auto-update schema for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── SQL Initializer ───────────────────────────────────────
spring.sql.init.mode=never

# ── Server ────────────────────────────────────────────────
server.port=8080

# ── CORS (allow browser to call API) ─────────────────────
spring.mvc.cors.allowed-origins=*

# ── Disable Static Resource Caching (Prevents Windows FileSystemException) ──
server.tomcat.resource.caching-allowed=false
spring.web.resources.chain.cache=false
spring.web.resources.cache.period=0
